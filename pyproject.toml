[project]
name = "erp-oms-wms"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "redis>=5",
  "arq>=0.26",
]

[dependency-groups]
dev = [
  "httpx2",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_oms_wms"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/erp_oms_wms/api/**/*.py" = ["B008"]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
  "integration: tests that need PostgreSQL (TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["src"]
branch = true
